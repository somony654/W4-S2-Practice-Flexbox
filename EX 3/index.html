<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  <style>
    body {
      font-family: "Sono", sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f4f6fb;
    }

    .pricing-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: stretch;    
      gap: 30px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .pricing-plan {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s;
    }
    .pricing-plan:hover {
      transform: translateY(-8px);
    }

    .plan-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .plan-price {
      font-size: 20px;
      color: #6c47ff;
      margin-bottom: 20px;
    }

    .plan-features {
      list-style: none;
      padding: 0;
      margin: 0 0 24px;
      flex: 1; 
    }
    .plan-features li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .plan-button {
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #6c47ff, #e0359b);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    /* Smaller screens: stack the plans vertically */
    @media (max-width: 1250px) {
      .pricing-container {
        flex-direction: column;
        align-items: center;
      }
      .pricing-plan {
        flex: none;
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
      }
    }
  </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
